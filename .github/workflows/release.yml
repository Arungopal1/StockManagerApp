# ============================================================================
# GitHub Actions: Auto Build & Release APK/AAB (₹0 Cost)
# File: .github/workflows/release.yml
# ============================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'                    # Triggers on git tag: v1.0.0, v1.0.1, etc.
  workflow_dispatch:            # Manual trigger from Actions tab
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write               # Needed to create releases
  packages: read                # For caching

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  # ============================================================================
  # BUILD JOB - Compiles, tests, builds APK & AAB
  # ============================================================================
  build:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Needed for changelog generation
      
      # --- Setup Java 17 ---
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      
      # --- Setup Android SDK ---
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: 34.0.0
          cmdline-tools-version: latest
      
      # --- Decode Keystore (from Base64 secret) ---
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          cat > local.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      
      # --- Build Debug APK (for PRs) ---
      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug
      
      # --- Build Release AAB + APK (for tags) ---
      - name: Build Release
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew clean bundleRelease assembleRelease
      
      # --- Upload Artifacts ---
      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      
      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30
  
  # ============================================================================
  # RELEASE JOB - Creates GitHub Release with APK/AAB
  # ============================================================================
  release:
    name: Create Release
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release/
      
      # Generate changelog from commits since last tag
      - name: Generate Changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" --reverse)
          else
            CHANGELOG=$(git log HEAD --pretty=format:"- %s (%an)" --reverse | head -50)
          fi
          
          # Format for release body
          {
            echo "changelog<<EOF"
            echo "## What's New"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      # Create Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/app-release.aab
            release/app-release.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
  
  # ============================================================================
  # ANALYSIS JOB - Lint, Detekt, Tests (runs on PRs)
  # ============================================================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
      
      - name: Run Lint
        run: ./gradlew lintDebug
      
      - name: Run Detekt (if configured)
        run: ./gradlew detekt
        continue-on-error: true
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
          retention-days: 7

  # ============================================================================
  # DEPENDENCY CHECK - Security vulnerabilities
  # ============================================================================
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'StockManagerApp'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --suppression suppression.xml
      
      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
          retention-days: 30

# ============================================================================
# REQUIRED GITHUB SECRETS (Add in Repo Settings → Secrets → Actions)
# ============================================================================
# 
# 1. KEYSTORE_BASE64        = base64 -w0 your-keystore.jks
# 2. KEYSTORE_PASSWORD      = your keystore password
# 3. KEY_ALIAS              = your key alias (e.g., "stockmanager")
# 4. KEY_PASSWORD           = your key password
#
# Optional (for Play Store deployment later):
# 5. PLAY_SERVICE_ACCOUNT   = base64 of Google Play service account JSON
# 6. PLAY_TRACK             = "internal" or "alpha" or "beta" or "production"
#
# ============================================================================
# HOW TO GENERATE KEYSTORE:
# ============================================================================
# keytool -genkey -v \
#   -keystore stockmanager-release.jks \
#   -keyalg RSA \
#   -keysize 2048 \
#   -validity 10000 \
#   -alias stockmanager \
#   -storepass YOUR_STORE_PASSWORD \
#   -keypass YOUR_KEY_PASSWORD \
#   -dname "CN=Your Name, OU=Mobile Shop, O=StockManager, L=Your City, S=Your State, C=IN"
#
# Then: base64 -w0 stockmanager-release.jks  (copy output to KEYSTORE_BASE64 secret)
#
# ============================================================================
# HOW TO TRIGGER RELEASE:
# ============================================================================
# git tag v1.0.0
# git push origin v1.0.0
# 
# GitHub Actions will:
# 1. Build signed AAB + APK
# 2. Generate changelog from commits
# 3. Create GitHub Release with downloads
# 4. Users get APK from: https://github.com/OWNER/REPO/releases/latest
#
# ============================================================================